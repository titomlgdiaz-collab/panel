<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Escritorio">
<title>Escritorio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  /* Paleta pastel: lavanda y menta. Claro de día, ciruela de tarde y noche */
  body.claro {
    --fondo: #F2EDF9;
    --tarjeta: #E6DCF6;
    --tarjeta-menta: #DDF2E7;
    --texto: #2F2642;
    --texto-suave: #7A7090;
    --lila: #8F6FD6;
    --lila-pastel: #C9B5F3;
    --menta: #4FAF85;
    --menta-pastel: #A9E3C7;
    --rosa: #E07A97;
    --cielo: #6E9FDB;
    --melocoton: #E59A6E;
    --ambar: #CF9426;
    --linea: rgba(47, 38, 66, 0.12);
    --foco-fondo: #E4F4EC;
    --descanso-fondo: #ECE4FA;
  }
  body.oscuro {
    --fondo: #241E33;
    --tarjeta: rgba(201, 181, 243, 0.13);
    --tarjeta-menta: rgba(169, 227, 199, 0.12);
    --texto: #F1ECF8;
    --texto-suave: #A79EBB;
    --lila: #C9B5F3;
    --lila-pastel: #8F78C4;
    --menta: #A9E3C7;
    --menta-pastel: #5E9C80;
    --rosa: #F2A7BA;
    --cielo: #A9C7EE;
    --melocoton: #F3BD9F;
    --ambar: #EBCB8B;
    --linea: rgba(241, 236, 248, 0.14);
    --foco-fondo: #1D2B27;
    --descanso-fondo: #2A2240;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--fondo);
    color: var(--texto);
    font-family: "Bricolage Grotesque", -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 17px;
    line-height: 1.35;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }
  body.noche .panel { opacity: 0.82; }
  button {
    font: inherit; color: inherit; background: none; border: 0; padding: 0;
    cursor: pointer; text-align: left;
  }
  .ico { width: 1em; height: 1em; display: inline-block; vertical-align: -0.14em; flex-shrink: 0;
    fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  .panel {
    box-sizing: border-box;
    height: 100%;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr);
  }

  /* ===== Columna izquierda ===== */
  .izq { padding: 26px 28px 22px 40px; display: flex; flex-direction: column; min-height: 0; }
  .hora {
    font-weight: 800; font-size: 11vw; line-height: 0.88; letter-spacing: -0.045em;
    font-variant-numeric: tabular-nums; margin-left: -0.04em;
  }
  .subhora { display: flex; align-items: center; margin-top: 10px; color: var(--texto-suave); }
  .fecha { font-size: 21px; }
  .tiempo { margin-left: auto; font-size: 16px; white-space: nowrap; display: flex; align-items: center; }
  .tiempo .ico { font-size: 24px; color: var(--lila); margin-right: 6px; }
  .tiempo b { color: var(--texto); font-weight: 600; font-size: 21px; margin-right: 6px; }

  .foco-zona { margin-top: 20px; background: var(--tarjeta-menta); border-radius: 18px; padding: 14px 16px 14px; }
  .foco-cab { display: flex; align-items: center; font-weight: 600; font-size: 16px; color: var(--menta); margin-bottom: 10px; }
  .foco-cab .ico { font-size: 20px; margin-right: 8px; }
  .foco-tarea { font-weight: 400; color: var(--texto-suave); margin-left: 8px; display: flex; align-items: center; min-width: 0; flex: 1; }
  .foco-tarea span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .foco-tarea button { margin-left: 6px; padding: 2px 6px; }
  .foco-botones { display: flex; }
  .foco-btn {
    background: var(--fondo); border-radius: 12px; padding: 11px 0; flex: 1;
    text-align: center; font-weight: 600; font-size: 18px;
  }
  .foco-btn + .foco-btn { margin-left: 8px; }
  .foco-btn.libre { color: var(--texto-suave); font-weight: 400; }
  .foco-stats { display: flex; align-items: flex-end; margin-top: 12px; }
  .objetivo { flex: 1; min-width: 0; margin-right: 16px; }
  .objetivo-linea { display: flex; align-items: baseline; font-size: 14px; color: var(--texto-suave); }
  .foco-hoy { flex: 1; min-width: 0; }
  .foco-hoy b { color: var(--texto); font-weight: 600; }
  .objetivo-btn { font-size: 13px; color: var(--texto-suave); padding: 2px 0 2px 10px; white-space: nowrap; text-decoration: underline; text-decoration-color: var(--linea); }
  .objetivo-barra { height: 8px; background: var(--fondo); border-radius: 4px; overflow: hidden; margin-top: 7px; }
  .objetivo-barra div { height: 100%; width: 0; background: var(--menta); border-radius: 4px; transition: width 0.6s; }
  .objetivo.cumplido .objetivo-barra div { background: var(--lila); }
  .objetivo.cumplido .foco-hoy b { color: var(--lila); }
  .semana { display: flex; align-items: flex-end; height: 34px; }
  .semana-dia { width: 13px; margin-left: 6px; text-align: center; font-size: 11px; color: var(--texto-suave); }
  .semana-barra { background: var(--menta); border-radius: 3px 3px 0 0; margin-bottom: 2px; min-height: 2px; opacity: 0.55; }
  .semana-dia.hoy { color: var(--texto); font-weight: 600; }
  .semana-dia.hoy .semana-barra { opacity: 1; }

  .agenda-zona { margin-top: 18px; flex: 1; min-height: 0; overflow: hidden; }
  .destacado { display: flex; align-items: center; background: var(--tarjeta); border-radius: 16px; padding: 12px 14px; margin-bottom: 14px; }
  .destacado-icono { width: 44px; height: 44px; border-radius: 12px; background: var(--fondo); display: flex; align-items: center; justify-content: center; margin-right: 12px; flex-shrink: 0; }
  .destacado-icono .ico { font-size: 24px; }
  .destacado-texto { min-width: 0; }
  .destacado-cuenta { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
  .destacado-nombre { font-size: 15px; color: var(--texto-suave); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .destacado.pronto { background: var(--lila-pastel); }
  .destacado.entrega.pronto { background: var(--rosa); color: #fff; }
  .destacado.entrega.pronto .destacado-nombre { color: rgba(255, 255, 255, 0.85); }
  .agenda-dia { color: var(--texto-suave); font-size: 14px; margin: 10px 0 2px; }
  .agenda-dia:first-child { margin-top: 0; }
  .evento { display: flex; align-items: center; padding: 4px 0; font-size: 16px; }
  .evento .ico { font-size: 18px; margin-right: 10px; }
  .evento-hora { width: 48px; flex-shrink: 0; color: var(--texto-suave); font-variant-numeric: tabular-nums; }
  .evento-titulo { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t-clase { color: var(--lila); }
  .t-entrega { color: var(--rosa); }
  .t-gym { color: var(--menta); }
  .t-futbol { color: var(--cielo); }
  .t-viaje { color: var(--melocoton); }
  .t-baloncesto { color: var(--ambar); }
  .t-otro { color: var(--texto-suave); }

  /* ===== Columna derecha: TFE ===== */
  .der { padding: 26px 40px 22px 28px; border-left: 1px solid var(--linea); display: flex; flex-direction: column; min-height: 0; }
  .tfe-cab { display: flex; align-items: center; }
  .tfe-titulo { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; margin: 0; display: flex; align-items: center; }
  .tfe-titulo .ico { color: var(--lila); font-size: 30px; margin-right: 10px; }
  .tfe-dias { margin-left: auto; text-align: right; }
  .tfe-dias b { font-size: 32px; font-weight: 800; letter-spacing: -0.03em; color: var(--lila); }
  .tfe-dias span { display: block; font-size: 13px; color: var(--texto-suave); }
  .progreso { margin: 12px 0 5px; height: 10px; background: var(--tarjeta); border-radius: 5px; overflow: hidden; }
  .progreso div { height: 100%; background: var(--menta); border-radius: 5px; width: 0; transition: width 0.6s; }
  .progreso-texto { font-size: 14px; color: var(--texto-suave); }
  .animo { display: flex; align-items: flex-start; font-size: 15px; color: var(--texto); margin: 10px 0 12px; }
  .animo .ico { color: var(--menta); font-size: 18px; margin: 1px 8px 0 0; }
  .animo em { font-style: normal; color: var(--texto-suave); }
  .tfe-lista { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; margin-right: -12px; padding-right: 12px; }
  .grupo { font-size: 14px; color: var(--texto-suave); margin: 14px 0 4px; }
  .grupo:first-child { margin-top: 4px; }
  .grupo.atrasadas { color: var(--rosa); }
  .tarea { border-bottom: 1px solid var(--linea); }
  .tarea-cab { display: flex; align-items: center; width: 100%; padding: 10px 0; }
  .tarea-punto { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; margin-right: 12px; }
  .tarea-nombre { flex: 1; min-width: 0; font-size: 17px; }
  .tarea:not(.abierta) .tarea-nombre { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tarea-meta { margin-left: 10px; font-size: 14px; color: var(--texto-suave); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tarea.atrasada .tarea-meta { color: var(--rosa); }
  .rapida { color: var(--menta); margin-right: 6px; }
  .tarea-detalle { padding: 0 0 14px 22px; font-size: 15px; color: var(--texto-suave); }
  .tarea-detalle p { margin: 0 0 6px; }
  .tarea-detalle strong { color: var(--texto); font-weight: 600; }
  .tarea-botones { display: flex; flex-wrap: wrap; margin-top: 10px; }
  .tarea-botones button { background: var(--tarjeta); border-radius: 10px; padding: 9px 13px; font-size: 15px; color: var(--texto); margin: 0 8px 6px 0; }
  .tarea-botones .confirmar { background: var(--menta); color: #fff; }
  .unico { background: var(--tarjeta); border-radius: 16px; padding: 14px 16px 10px; margin-bottom: 8px; }
  .unico.hecho { background: var(--tarjeta-menta); padding-bottom: 14px; }
  .unico-etiqueta { font-size: 14px; color: var(--lila); display: flex; align-items: center; font-weight: 600; }
  .unico-etiqueta .ico { font-size: 17px; margin-right: 6px; }
  .unico.hecho .unico-etiqueta { color: var(--menta); }
  .unico-nombre { font-size: 21px; font-weight: 600; line-height: 1.2; margin: 5px 0 6px; letter-spacing: -0.01em; }
  .unico.hecho .unico-nombre { text-decoration: line-through; opacity: 0.6; margin-bottom: 0; }
  .unico-criterio { font-size: 15px; color: var(--texto-suave); }
  .unico .tarea-botones button { background: var(--fondo); }
  .unico-vacio { font-size: 15px; color: var(--texto-suave); border: 1.5px dashed var(--lila-pastel); border-radius: 16px; padding: 12px 16px; margin-bottom: 8px; display: flex; align-items: center; }
  .unico-vacio .ico { color: var(--lila); font-size: 20px; margin-right: 10px; }
  .aviso { color: var(--texto-suave); font-size: 15px; }
  .aviso code { color: var(--texto); }

  /* ===== Aviso flotante ===== */
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 30;
    background: var(--texto); color: var(--fondo); border-radius: 14px; padding: 12px 20px;
    font-size: 17px; font-weight: 600; display: flex; align-items: center; white-space: nowrap;
  }
  .toast .ico { margin-right: 8px; color: var(--menta-pastel); font-size: 20px; }

  /* ===== Capa de foco ===== */
  .foco {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 20;
    background: var(--foco-fondo); display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 30px;
    box-sizing: border-box;
  }
  .foco.descanso { background: var(--descanso-fondo); }
  .foco-icono { font-size: 52px; color: var(--menta); margin-bottom: 8px; }
  .foco.descanso .foco-icono { color: var(--lila); }
  .foco-etiqueta { font-size: 20px; color: var(--texto-suave); max-width: 80%; }
  .foco-reloj {
    font-weight: 800; font-size: 20vw; line-height: 1; letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums; margin: 8px 0 6px;
  }
  .foco.pausado .foco-reloj { opacity: 0.35; }
  .foco-aviso { color: var(--rosa); font-size: 17px; min-height: 24px; }
  .foco-acciones { display: flex; margin-top: 24px; }
  .foco-acciones button { background: var(--fondo); border-radius: 14px; padding: 13px 26px; font-size: 18px; font-weight: 600; }
  .foco-acciones button + button { margin-left: 12px; }
  .foco-acciones .principal { background: var(--texto); color: var(--fondo); }

  @media (orientation: portrait) {
    .panel { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
    .hora { font-size: 19vw; }
    .izq { padding: 26px 36px 10px; }
    .agenda-zona { max-height: 220px; }
    .der { border-left: 0; border-top: 1px solid var(--linea); padding: 18px 36px 10px; }
    .foco-reloj { font-size: 26vw; }
  }
  @media (prefers-reduced-motion: reduce) {
    .progreso div, .objetivo-barra div { transition: none; }
  }
</style>
</head>
<body class="dia claro">
<div class="panel">
  <section class="izq">
    <div class="hora" id="hora">--:--</div>
    <div class="subhora">
      <span class="fecha" id="fecha"></span>
      <span class="tiempo" id="tiempo"></span>
    </div>

    <div class="foco-zona">
      <div class="foco-cab"><span data-ico="reloj"></span>Foco<div class="foco-tarea" id="foco-tarea" hidden></div></div>
      <div class="foco-botones">
        <button class="foco-btn" data-min="25">25 min</button>
        <button class="foco-btn" data-min="50">50 min</button>
        <button class="foco-btn" data-min="90">90 min</button>
        <button class="foco-btn libre" data-min="0">Libre</button>
      </div>
      <div class="foco-stats">
        <div class="objetivo" id="objetivo">
          <div class="objetivo-linea">
            <span class="foco-hoy" id="foco-hoy"></span>
            <button class="objetivo-btn" id="objetivo-btn"></button>
          </div>
          <div class="objetivo-barra"><div id="objetivo-relleno"></div></div>
        </div>
        <div class="semana" id="semana"></div>
      </div>
    </div>

    <div class="agenda-zona">
      <div class="destacado" id="destacado" hidden></div>
      <div id="agenda"><p class="aviso">Cargando tu calendario…</p></div>
    </div>
  </section>

  <section class="der">
    <div class="tfe-cab">
      <h1 class="tfe-titulo"><span data-ico="birrete"></span>TFE</h1>
      <div class="tfe-dias" id="tfe-dias"></div>
    </div>
    <div class="progreso"><div id="progreso"></div></div>
    <div class="progreso-texto" id="progreso-texto"></div>
    <div class="animo" id="animo" hidden></div>
    <div id="unico"></div>
    <div class="tfe-lista" id="tfe-lista"><p class="aviso">Cargando tareas de Notion…</p></div>
  </section>

</div>

<div class="foco" id="foco" hidden>
  <div class="foco-icono" id="foco-icono"></div>
  <div class="foco-etiqueta" id="foco-etiqueta"></div>
  <div class="foco-reloj" id="foco-reloj">00:00</div>
  <div class="foco-aviso" id="foco-aviso"></div>
  <div class="foco-acciones" id="foco-acciones"></div>
</div>
<div class="toast" id="toast" hidden></div>

function icono(nombre) {

var DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
var INICIALES = ['D', 'L', 'M', 'X', 'J', 'V', 'S'];
var MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
var MESES_CORTOS = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];

/* ---------- Utilidades ---------- */
function $(id) { return document.getElementById(id); }
function dos(n) { return n < 10 ? '0' + n : '' + n; }
function hora(d) { return dos(d.getHours()) + ':' + dos(d.getMinutes()); }
function capital(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function texto(el, t) { if (el.textContent !== t) { el.textContent = t; } }
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function inicioDia(d) { var x = new Date(d.getTime()); x.setHours(0, 0, 0, 0); return x; }
function diasEntre(a, b) { return Math.round((inicioDia(b) - inicioDia(a)) / 86400000); }
function claveDia(d) { return d.getFullYear() + '-' + dos(d.getMonth() + 1) + '-' + dos(d.getDate()); }
function leerFecha(s) { var p = s.split('T')[0].split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function fechaCorta(d) { return d.getDate() + ' ' + MESES_CORTOS[d.getMonth()]; }
function nombreDia(fecha, ahora) {
  var n = diasEntre(ahora, fecha);
  if (n === 0) { return 'Hoy'; }
  if (n === 1) { return 'Mañana'; }
  return capital(DIAS[fecha.getDay()]) + ' ' + fecha.getDate();
}
function duracionTexto(min) {
  if (min < 60) { return min + ' min'; }
  var h = Math.floor(min / 60), m = min % 60;
  return h + ' h' + (m ? ' ' + m + ' min' : '');
}
function guardar(clave, valor) { try { localStorage.setItem(clave, JSON.stringify(valor)); } catch (e) {} }
function leer(clave, defecto) {
  try { var v = localStorage.getItem(clave); return v ? JSON.parse(v) : defecto; } catch (e) { return defecto; }
}
function pedirJSON(url, cb) {
  var x = new XMLHttpRequest();
  x.open('GET', url);
  x.timeout = 15000;
  x.onload = function () {
    if (x.status >= 200 && x.status < 300) {
      try { cb(null, JSON.parse(x.responseText)); } catch (e) { cb(e); }
    } else { cb(new Error('HTTP ' + x.status)); }
  };
  x.onerror = function () { cb(new Error('red')); };
  x.ontimeout = function () { cb(new Error('tiempo')); };
  x.send();
}
function leerClave() {
  var m = location.hash.match(/clave=([^&]+)/);
  if (m) { var c = decodeURIComponent(m[1]); guardar('panel-clave', c); return c; }
  return leer('panel-clave', '');
}
// Llamada JSONP al script de Google (funciona en el Safari antiguo sin problemas de permisos)
function llamarScript(params, cb) {
  var nombre = 'cb' + Date.now() + Math.floor(Math.random() * 1000);
  var script = document.createElement('script');
  var terminado = false;
  var fin = function (err, datos) {
    if (terminado) { return; }
    terminado = true;
    clearTimeout(espera);
    try { delete window[nombre]; } catch (e) { window[nombre] = undefined; }
    if (script.parentNode) { script.parentNode.removeChild(script); }
    cb(err, datos);
  };
  var espera = setTimeout(function () { fin(new Error('tiempo')); }, 25000);
  window[nombre] = function (datos) { fin(null, datos); };
  var q = '?clave=' + encodeURIComponent(leerClave()) + '&callback=' + nombre;
  for (var k in params) { if (params.hasOwnProperty(k)) { q += '&' + k + '=' + encodeURIComponent(params[k]); } }
  script.src = CONFIG.scriptUrl + q;
  script.onerror = function () { fin(new Error('red')); };
  document.body.appendChild(script);
}

/* ---------- Reloj ---------- */
var ultimoMinuto = -1;
function fase(h) {
  if (h >= 7 && h < 11) { return 'manana'; }
  if (h >= 11 && h < 18) { return 'dia'; }
  if (h >= 18 && h < 22) { return 'tarde'; }
  return 'noche';
}
function tick() {
  var a = new Date();
  if (a.getMinutes() === ultimoMinuto) { return; }
  ultimoMinuto = a.getMinutes();
  texto($('hora'), hora(a));
  texto($('fecha'), capital(DIAS[a.getDay()]) + ', ' + a.getDate() + ' de ' + MESES[a.getMonth()]);
  var f = fase(a.getHours());
  var clase = f + (f === 'manana' || f === 'dia' ? ' claro' : ' oscuro');
  if (document.body.className !== clase) { document.body.className = clase; }
  pintarAgenda();
  pintarTFE();
  pintarEstadisticas();
  if (a.getHours() === 4 && Date.now() - cargadoEn > 3600000 && !foco) { location.reload(); }
}

/* ---------- Tiempo ---------- */
function infoTiempo(c, esDia) {
  if (c === 0) { return { i: esDia ? 'sol' : 'luna', t: 'Despejado' }; }
  if (c === 1 || c === 2) { return { i: esDia ? 'solnube' : 'luna', t: 'Algunas nubes' }; }
  if (c === 3) { return { i: 'nube', t: 'Nublado' }; }
  if (c === 45 || c === 48) { return { i: 'niebla', t: 'Niebla' }; }
  if ((c >= 51 && c <= 67) || (c >= 80 && c <= 82)) { return { i: 'lluvia', t: 'Lluvia' }; }
  if ((c >= 71 && c <= 77) || c === 85 || c === 86) { return { i: 'nieve', t: 'Nieve' }; }
  if (c >= 95) { return { i: 'tormenta', t: 'Tormenta' }; }
  return { i: 'nube', t: '' };
}
function cargarTiempo() {
  var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + CONFIG.lat + '&longitude=' + CONFIG.lon +
    '&current=temperature_2m,weather_code,is_day&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max' +
    '&timezone=Europe%2FMadrid&forecast_days=1';
  pedirJSON(url, function (err, d) {
    if (err || !d.current) { return; }
    var info = infoTiempo(d.current.weather_code, d.current.is_day === 1);
    var lluvia = d.daily.precipitation_probability_max[0];
    $('tiempo').innerHTML = icono(info.i) + '<b>' + Math.round(d.current.temperature_2m) + '°</b>' +
      Math.round(d.daily.temperature_2m_max[0]) + '° / ' + Math.round(d.daily.temperature_2m_min[0]) + '°' +
      (lluvia >= 30 ? ', lluvia ' + lluvia + '%' : '');
  });
}

/* ---------- Datos: calendario + Notion ---------- */
function cargarDatos() {
  if (!CONFIG.scriptUrl) {
    errorAgenda = errorTFE = 'Falta conectar el script. Pega su URL en <code>scriptUrl</code>, dentro del archivo.';
    pintarAgenda(); pintarTFE(); return;
  }
  if (!leerClave()) {
    errorAgenda = errorTFE = 'Falta la clave. Abre el panel con <code>#clave=TU_CLAVE</code> al final del enlace.';
    pintarAgenda(); pintarTFE(); return;
  }
  llamarScript({}, function (err, d) {
    if (err) {
      if (eventos === null) { errorAgenda = 'No se pudo leer el calendario. Se reintentará en unos minutos.'; }
      if (tfe === null) { errorTFE = 'No se pudo leer Notion. Se reintentará en unos minutos.'; }
    } else if (d.error === 'clave') {
      errorAgenda = errorTFE = 'La clave no coincide con la del script. Revisa el final del enlace.';
    } else {
      if (d.eventos && d.eventos.error) { errorAgenda = 'Calendario: ' + esc(d.eventos.error); }
      else if (d.eventos) { errorAgenda = ''; eventos = normalizar(d.eventos); }
      if (d.tfe && d.tfe.error) { errorTFE = 'Notion: ' + esc(d.tfe.error); }
      else if (d.tfe) { errorTFE = ''; tfe = d.tfe; hechasLocal = {}; }
    }
    pintarAgenda();
    pintarTFE();
  });
}
function categoria(e) {
  if (e.clase) { return 'clase'; }
  for (var i = 0; i < CONFIG.categorias.length; i++) {
    if (CONFIG.categorias[i].patron.test(e.titulo)) { return CONFIG.categorias[i].tipo; }
  }
  return 'otro';
}
function normalizar(lista) {
  var r = [];
  for (var i = 0; i < lista.length; i++) {
    var e = lista[i];
    var ini = new Date(e.inicio);
    var fin = new Date(e.fin);
    if (!e.todoElDia && fin <= ini) { fin = new Date(e.inicio + (e.duracion || 60) * 60000); }
    var ev = { titulo: e.titulo, tema: e.tema || '', ini: ini, fin: fin, todoElDia: e.todoElDia, clase: e.clase };
    ev.tipo = categoria(ev);
    r.push(ev);
  }
  r.sort(function (a, b) { return a.ini - b.ini; });
  return r;
}

/* ---------- Agenda ---------- */
function cuentaAtras(ev, ahora) {
  if (ev.tipo === 'entrega') {
    var d = diasEntre(ahora, ev.ini);
    if (d === 0) { return 'Entrega hoy a las ' + hora(ev.ini); }
    if (d === 1) { return 'Entrega mañana'; }
    return 'Entrega en ' + d + ' días';
  }
  if (ahora >= ev.ini) { return 'En clase, hasta las ' + hora(ev.fin); }
  var min = Math.ceil((ev.ini - ahora) / 60000);
  var dias = diasEntre(ahora, ev.ini);
  if (dias === 0) { return 'Clase en ' + duracionTexto(min); }
  if (dias === 1) { return 'Clase mañana a las ' + hora(ev.ini); }
  return 'Clase en ' + dias + ' días';
}
function proximoImportante(ahora) {
  if (!eventos) { return null; }
  for (var i = 0; i < eventos.length; i++) {
    var e = eventos[i];
    if ((e.tipo === 'clase' || e.tipo === 'entrega') && e.fin > ahora) { return e; }
  }
  return null;
}
function pintarAgenda() {
  var cont = $('agenda');
  var dest = $('destacado');
  if (errorAgenda) { dest.hidden = true; cont.innerHTML = '<p class="aviso">' + errorAgenda + '</p>'; return; }
  if (eventos === null) { return; }
  var ahora = new Date();

  var imp = proximoImportante(ahora);
  if (imp) {
    var pronto = imp.tipo === 'entrega' ? diasEntre(ahora, imp.ini) <= 1 : (imp.ini - ahora) < 3600000;
    dest.className = 'destacado' + (imp.tipo === 'entrega' ? ' entrega' : '') + (pronto ? ' pronto' : '');
    dest.innerHTML = '<div class="destacado-icono t-' + imp.tipo + '">' + icono(imp.tipo) + '</div>' +
      '<div class="destacado-texto"><div class="destacado-cuenta">' + cuentaAtras(imp, ahora) + '</div>' +
      '<div class="destacado-nombre">' + esc(imp.titulo) + (imp.tema ? ', ' + esc(imp.tema) : '') + '</div></div>';
    dest.hidden = false;
  } else {
    dest.hidden = true;
  }

  var html = '';
  var diaActual = '';
  var mostrados = 0;
  for (var i = 0; i < eventos.length && mostrados < 8; i++) {
    var e = eventos[i];
    if (e.fin <= ahora || diasEntre(ahora, e.ini) > 7) { continue; }
    var dia = nombreDia(e.ini < ahora ? ahora : e.ini, ahora);
    if (dia !== diaActual) { html += '<div class="agenda-dia">' + dia + '</div>'; diaActual = dia; }
    html += '<div class="evento"><span class="t-' + e.tipo + '">' + icono(e.tipo) + '</span>' +
      '<span class="evento-hora">' + (e.todoElDia ? 'Día' : hora(e.ini)) + '</span>' +
      '<span class="evento-titulo">' + esc(e.titulo) + '</span></div>';
    mostrados++;
  }
  cont.innerHTML = html || '<p class="aviso">Semana libre en el calendario.</p>';
}

/* ---------- TFE (Notion) ---------- */
function fechaDeposito() {
  if (!tfe) { return null; }
  var max = null;
  for (var i = 0; i < tfe.tareas.length; i++) {
    var t = tfe.tareas[i];
    if (!t.fecha) { continue; }
    if (/deposit/i.test(t.tarea)) { return leerFecha(t.fecha); }
    var f = leerFecha(t.fecha);
    if (!max || f > max) { max = f; }
  }
  return max;
}
function filaTarea(t, hoy, atrasada) {
  var abierta = tareaAbierta === t.id;
  var f = t.fecha ? leerFecha(t.fecha) : null;
  var meta = (t.rapida ? '<span class="rapida">5 min</span>' : '') + (f ? fechaCorta(f) : '');
  var h = '<div class="tarea' + (atrasada ? ' atrasada' : '') + (abierta ? ' abierta' : '') + '">' +
    '<button class="tarea-cab" data-accion="abrir" data-id="' + t.id + '">' +
    '<span class="tarea-punto" style="background:' + (COLOR_BLOQUE[t.bloque] || '#9B9A97') + '"></span>' +
    '<span class="tarea-nombre">' + esc(t.tarea) + '</span>' +
    '<span class="tarea-meta">' + meta + '</span></button>';
  if (abierta) {
    h += '<div class="tarea-detalle">' +
      (t.bloque ? '<p>' + esc(t.bloque) + (t.estado === 'En curso' ? ', en curso' : '') + '</p>' : '') +
      (t.hechaCuando ? '<p><strong>Está hecha cuando:</strong> ' + esc(t.hechaCuando) + '</p>' : '') +
      (t.donde ? '<p><strong>Dónde está:</strong> ' + esc(t.donde) + '</p>' : '') +
      (t.depende ? '<p><strong>Depende de:</strong> ' + esc(t.depende) + '</p>' : '') +
      '<div class="tarea-botones">' +
      '<button data-accion="unico" data-id="' + t.id + '">Lo único de hoy</button>' +
      '<button data-accion="enfocar" data-id="' + t.id + '">Concentrarme en esta</button>' +
      '<button data-accion="hecha" data-id="' + t.id + '"' + (confirmando === t.id ? ' class="confirmar">Toca otra vez para confirmar' : '>Marcar como hecha') + '</button>' +
      '</div></div>';
  }
  return h + '</div>';
}
function pintarTFE() {
  var cont = $('tfe-lista');
  if (errorTFE && !tfe) { cont.innerHTML = '<p class="aviso">' + errorTFE + '</p>'; return; }
  if (!tfe) { return; }
  var hoy = inicioDia(new Date());
  pintarUnico();
  var fijada = unicoHoy();

  var dep = fechaDeposito();
  if (dep) {
    var dd = diasEntre(hoy, dep);
    $('tfe-dias').innerHTML = '<b>' + dd + ' días</b><span>para depositar, el ' + dep.getDate() + ' de ' + MESES[dep.getMonth()] + '</span>';
  }

  var pendientes = [];
  var nHechasLocal = 0;
  for (var i = 0; i < tfe.tareas.length; i++) {
    if (hechasLocal[tfe.tareas[i].id]) { nHechasLocal++; } else { pendientes.push(tfe.tareas[i]); }
  }
  var hechas = tfe.hechas + nHechasLocal;
  $('progreso').style.width = (tfe.total ? Math.round(hechas * 100 / tfe.total) : 0) + '%';
  texto($('progreso-texto'), hechas + ' de ' + tfe.total + ' tareas hechas');
  pintarAnimo(hechas, dep ? diasEntre(hoy, dep) : null);

  // Domingo de esta semana
  var finSemana = new Date(hoy.getTime());
  finSemana.setDate(hoy.getDate() + ((7 - hoy.getDay()) % 7));

  var enCurso = [], atrasadas = [], semana = [], despues = [];
  pendientes.forEach(function (t) {
    if (fijada && fijada.id === t.id) { return; }
    var f = t.fecha ? leerFecha(t.fecha) : null;
    if (t.estado === 'En curso') { enCurso.push(t); }
    else if (f && f < hoy) { atrasadas.push(t); }
    else if (f && f <= finSemana) { semana.push(t); }
    else { despues.push(t); }
  });

  var html = '';
  if (enCurso.length) {
    html += '<div class="grupo">En curso</div>';
    enCurso.forEach(function (t) { html += filaTarea(t, hoy, false); });
  }
  if (atrasadas.length) {
    html += '<div class="grupo atrasadas">Atrasadas</div>';
    atrasadas.forEach(function (t) { html += filaTarea(t, hoy, true); });
  }
  if (semana.length) {
    html += '<div class="grupo">Esta semana</div>';
    semana.forEach(function (t) { html += filaTarea(t, hoy, false); });
  }
  if (despues.length) {
    html += '<div class="grupo">Lo siguiente</div>';
    despues.slice(0, 4).forEach(function (t) { html += filaTarea(t, hoy, false); });
  }
  if (errorTFE) { html = '<p class="aviso">' + errorTFE + '</p>' + html; }
  cont.innerHTML = html || '<p class="aviso">No quedan tareas pendientes en Notion.</p>';
}
function buscarTarea(id) {
  if (!tfe) { return null; }
  for (var i = 0; i < tfe.tareas.length; i++) { if (tfe.tareas[i].id === id) { return tfe.tareas[i]; } }
  return null;
}
var temporizadorConfirmar = null;
function alTocarTFE(ev) {
  var b = ev.target.closest ? ev.target.closest('[data-accion]') : null;
  if (!b) { return; }
  var id = b.getAttribute('data-id');
  var accion = b.getAttribute('data-accion');
  if (accion === 'abrir') {
    tareaAbierta = tareaAbierta === id ? null : id;
    confirmando = null;
    pintarTFE();
  } else if (accion === 'enfocar') {
    var t = buscarTarea(id);
    if (t) { guardar('panel-foco-tarea', { id: t.id, nombre: t.tarea, bloque: t.bloque }); pintarTareaFoco(); }
  } else if (accion === 'unico') {
    var tu = buscarTarea(id);
    if (tu) {
      guardar('panel-unico', { fecha: claveDia(new Date()), id: tu.id, nombre: tu.tarea, bloque: tu.bloque, hecho: false });
      tareaAbierta = null;
      pintarTFE();
      pintarTareaFoco();
    }
  } else if (accion === 'quitar-unico') {
    guardar('panel-unico', null);
    pintarTFE();
    pintarTareaFoco();
  } else if (accion === 'foco-unico') {
    var u0 = unicoHoy();
    if (u0) { guardar('panel-foco-tarea', { id: u0.id, nombre: u0.nombre, bloque: u0.bloque }); }
    accionesPintadas = '';
    empezarFoco(50, false);
  } else if (accion === 'hecha') {
    if (confirmando !== id) {
      confirmando = id;
      clearTimeout(temporizadorConfirmar);
      temporizadorConfirmar = setTimeout(function () { confirmando = null; pintarTFE(); }, 4000);
      pintarTFE();
      return;
    }
    confirmando = null;
    marcarHecha(id);
  }
}
$('tfe-lista').addEventListener('click', alTocarTFE);
$('unico').addEventListener('click', alTocarTFE);

  var pct = tfe.total ? hechas / tfe.total : 0;

  else if (pct >= 0.75) { dato = 'Ya tienes tres cuartas partes hechas.'; }
  else if (pct >= 0.5) { dato = 'Ya has pasado la mitad.'; }
  else if (pct >= 0.25) { dato = 'Llevas un cuarto del camino.'; }
  var hoy = new Date();
  var n = Math.floor((hoy - new Date(hoy.getFullYear(), 0, 1)) / 86400000);
  var frase = FRASES[n % FRASES.length];
  el.innerHTML = icono('chispa') + '<span>' + (dato ? dato + ' <em>' + frase + '</em>' : frase) + '</span>';
  el.hidden = false;
}
function aviso(mensaje) {
  var t = $('toast');
  t.innerHTML = icono('check') + esc(mensaje);
  t.hidden = false;
  clearTimeout(aviso.temporizador);
  aviso.temporizador = setTimeout(function () { t.hidden = true; }, 3500);
}

/* ---------- Lo único de hoy ---------- */
function unicoHoy() {
  var u = leer('panel-unico', null);
  return u && u.fecha === claveDia(new Date()) ? u : null;
}
function pintarUnico() {
  var el = $('unico');
  var u = unicoHoy();
  if (!u) {
    el.className = 'unico-vacio';
    el.innerHTML = icono('estrella') + '<span>Elige lo único de hoy: abre una tarea y pulsa «Lo único de hoy».</span>';
    return;
  }
  var t = buscarTarea(u.id);
  var hecho = u.hecho || hechasLocal[u.id] || (tfe && !t);
  el.className = 'unico' + (hecho ? ' hecho' : '');
  var html = '<div class="unico-etiqueta">' + (hecho ? icono('check') + 'Lo único de hoy, hecho. Lo demás es extra.' : icono('estrella') + 'Lo único de hoy') + '</div>' +
    '<div class="unico-nombre">' + esc(u.nombre) + '</div>';
  if (!hecho) {
    if (t && t.hechaCuando) { html += '<div class="unico-criterio">Está hecha cuando: ' + esc(t.hechaCuando) + '</div>'; }
    html += '<div class="tarea-botones">' +
      '<button data-accion="foco-unico">Empezar 50 min</button>' +
      '<button data-accion="hecha" data-id="' + u.id + '"' + (confirmando === u.id ? ' class="confirmar">Toca otra vez para confirmar' : '>Marcar como hecha') + '</button>' +
      '<button data-accion="quitar-unico">Cambiar</button></div>';
  }
  el.innerHTML = html;
}
function marcarHecha(id) {
  hechasLocal[id] = true;
  tareaAbierta = null;
  var un = unicoHoy();
  if (un && un.id === id) { un.hecho = true; guardar('panel-unico', un); }
  var quedan = tfe ? tfe.tareas.length - Object.keys(hechasLocal).length : 0;
  aviso('Una menos. Quedan ' + quedan + '.');
  var ft = leer('panel-foco-tarea', null);
  if (ft && ft.id === id) { guardar('panel-foco-tarea', null); pintarTareaFoco(); }
  pintarTFE();
  llamarScript({ accion: 'hecha', id: id }, function (err, d) {
    if (err || !d || !d.ok) {
      delete hechasLocal[id];
      var un2 = unicoHoy();
      if (un2 && un2.id === id) { un2.hecho = false; guardar('panel-unico', un2); }
      errorTFE = 'No se pudo marcar la tarea en Notion. Inténtalo otra vez.';
      pintarTFE();
      setTimeout(function () { errorTFE = ''; pintarTFE(); }, 6000);
    }
  });
}

/* ---------- Modo foco ---------- */
var foco = leer('panel-foco-actual', null);   // { minutos, inicio, pausadoEn, pausaTotal, tarea, descanso }
var intervaloFoco = null;
var ctxAudio = null;

function prepararSonido() {
  try {
    if (!ctxAudio) {
      var C = window.AudioContext || window.webkitAudioContext;
      if (C) { ctxAudio = new C(); }
    }
    if (ctxAudio) {
      if (ctxAudio.state === 'suspended' && ctxAudio.resume) { ctxAudio.resume(); }
      // Sonido mudo para desbloquear el audio en iOS
      var o = ctxAudio.createOscillator(), g = ctxAudio.createGain();
      g.gain.value = 0.0001; o.connect(g); g.connect(ctxAudio.destination);
      o.start(0); o.stop(ctxAudio.currentTime + 0.05);
    }
  } catch (e) {}
}
function campana() {
  if (!ctxAudio) { return; }
  try {
    var t = ctxAudio.currentTime;
    [660, 880, 990].forEach(function (f, i) {
      var o = ctxAudio.createOscillator(), g = ctxAudio.createGain();
      o.frequency.value = f;
      o.connect(g); g.connect(ctxAudio.destination);
      var d = t + i * 0.35;
      g.gain.setValueAtTime(0.0001, d);
      g.gain.exponentialRampToValueAtTime(0.35, d + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, d + 0.7);
      o.start(d); o.stop(d + 0.75);
    });
  } catch (e) {}
}
function transcurrido(f) {
  var fin = f.pausadoEn || Date.now();
  return Math.max(0, fin - f.inicio - f.pausaTotal);
}
function formatoReloj(ms) {
  var s = Math.round(ms / 1000);
  var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), seg = s % 60;
  return (h ? h + ':' + dos(m) : dos(m)) + ':' + dos(seg);
}
function empezarFoco(minutos, descanso) {
  prepararSonido();
  var ft = tareaParaFoco();
  foco = {
    minutos: minutos, inicio: Date.now(), pausadoEn: 0, pausaTotal: 0,
    tarea: descanso || !ft ? '' : ft.nombre, bloque: descanso || !ft ? '' : (ft.bloque || ''),
    descanso: !!descanso, terminado: false
  };
  guardar('panel-foco-actual', foco);
  abrirFoco();
}
function abrirFoco() {
  $('foco').hidden = false;
  pintarFoco();
  clearInterval(intervaloFoco);
  intervaloFoco = setInterval(pintarFoco, 1000);
}
function cerrarFoco() {
  clearInterval(intervaloFoco);
  foco = null;
  guardar('panel-foco-actual', null);
  $('foco').hidden = true;
  pintarEstadisticas();
}
function registrarFoco(ms) {
  var min = Math.round(ms / 60000);
  if (min < 1) { return; }
  var log = leer('panel-foco-log', {});
  var k = claveDia(new Date());
  if (!log[k]) { log[k] = { min: 0, bloques: 0 }; }
  log[k].min += min;
  log[k].bloques += 1;
  // Conservar solo los últimos 30 días
  var limite = claveDia(new Date(Date.now() - 30 * 86400000));
  for (var d in log) { if (log.hasOwnProperty(d) && d < limite) { delete log[d]; } }
  guardar('panel-foco-log', log);

  // Cola para la hoja de Google: si no hay conexión, se reintenta más tarde
  var cola = leer('panel-cola-foco', []);
  cola.push({
    inicio: foco ? foco.inicio : Date.now(),
    minutos: min,
    tarea: foco && foco.tarea ? foco.tarea : '',
    bloque: foco && foco.bloque ? foco.bloque : '',
    tipo: foco && foco.minutos ? 'Bloque de ' + foco.minutos + ' min' : 'Libre'
  });
  guardar('panel-cola-foco', cola);
  enviarCola();
}
var enviandoCola = false;
function enviarCola() {
  if (enviandoCola || !CONFIG.scriptUrl || !leerClave()) { return; }
  var cola = leer('panel-cola-foco', []);
  if (!cola.length) { return; }
  enviandoCola = true;
  var r = cola[0];
  llamarScript({ accion: 'registrar', inicio: r.inicio, minutos: r.minutos, tarea: r.tarea, bloque: r.bloque, tipo: r.tipo }, function (err, d) {
    enviandoCola = false;
    if (!err && d && d.ok) {
      var c = leer('panel-cola-foco', []);
      c.shift();
      guardar('panel-cola-foco', c);
      enviarCola();
    }
  });
}
function acciones(lista) {
  var cont = $('foco-acciones');
  cont.innerHTML = '';
  lista.forEach(function (a) {
    var b = document.createElement('button');
    b.textContent = a.texto;
    if (a.principal) { b.className = 'principal'; }
    b.addEventListener('click', a.fn);
    cont.appendChild(b);
  });
}
var accionesPintadas = '';
function pintarFoco() {
  if (!foco) { return; }
  var el = $('foco');
  var ms = transcurrido(foco);
  var cuenta = foco.minutos > 0;
  var restante = cuenta ? foco.minutos * 60000 - ms : 0;

  if (cuenta && restante <= 0 && !foco.terminado) {
    foco.terminado = true;
    foco.pausadoEn = Date.now();
    if (!foco.descanso) { registrarFoco(foco.minutos * 60000); }
    guardar('panel-foco-actual', foco);
    campana();
  }

  var iconoFoco = foco.descanso ? 'cafe' : (foco.terminado ? 'check' : 'reloj');
  if ($('foco-icono').getAttribute('data-i') !== iconoFoco) {
    $('foco-icono').innerHTML = icono(iconoFoco);
    $('foco-icono').setAttribute('data-i', iconoFoco);
  }
  el.className = 'foco' + (foco.descanso ? ' descanso' : '') + (foco.pausadoEn && !foco.terminado ? ' pausado' : '');
  texto($('foco-reloj'), foco.terminado ? '00:00' : formatoReloj(cuenta ? restante : ms));

  var etiqueta;
  if (foco.terminado) { etiqueta = foco.descanso ? 'Descanso terminado' : 'Bloque terminado. Levántate, estira y bebe agua.'; }
  else if (foco.descanso) { etiqueta = 'Descanso'; }
  else { etiqueta = foco.tarea ? foco.tarea : (cuenta ? 'Bloque de ' + foco.minutos + ' minutos' : 'Tiempo libre'); }
  texto($('foco-etiqueta'), etiqueta);

  // Aviso si algo del calendario empieza antes de que termine el bloque
  var aviso = '';
  if (eventos && !foco.terminado) {
    var ahora = new Date();
    var limite = cuenta ? Date.now() + restante + 10 * 60000 : Date.now() + 60 * 60000;
    for (var i = 0; i < eventos.length; i++) {
      var e = eventos[i];
      if (!e.todoElDia && e.ini > ahora && e.ini.getTime() <= limite) {
        aviso = 'A las ' + hora(e.ini) + ': ' + e.titulo;
        break;
      }
    }
  }
  texto($('foco-aviso'), aviso);

  var estadoAcciones = foco.terminado ? 'fin' + (foco.descanso ? 'd' : 'f') : (foco.pausadoEn ? 'pausa' : 'marcha');
  if (estadoAcciones === accionesPintadas) { return; }
  accionesPintadas = estadoAcciones;
  if (foco.terminado && !foco.descanso) {
    acciones([
      { texto: 'Descansar ' + CONFIG.descanso + ' min', principal: true, fn: function () { accionesPintadas = ''; empezarFoco(CONFIG.descanso, true); } },
      { texto: 'Otro bloque', fn: function () { var m = foco.minutos; accionesPintadas = ''; empezarFoco(m, false); } },
      { texto: 'Cerrar', fn: function () { accionesPintadas = ''; cerrarFoco(); } }
    ]);
  } else if (foco.terminado) {
    acciones([
      { texto: 'Otro bloque de 25', principal: true, fn: function () { accionesPintadas = ''; empezarFoco(25, false); } },
      { texto: 'Cerrar', fn: function () { accionesPintadas = ''; cerrarFoco(); } }
    ]);
  } else {
    acciones([
      { texto: foco.pausadoEn ? 'Seguir' : 'Pausar', principal: true, fn: function () {
          if (foco.pausadoEn) { foco.pausaTotal += Date.now() - foco.pausadoEn; foco.pausadoEn = 0; }
          else { foco.pausadoEn = Date.now(); }
          guardar('panel-foco-actual', foco);
          pintarFoco();
        } },
      { texto: 'Terminar', fn: function () {
          if (!foco.descanso) { registrarFoco(transcurrido(foco)); }
          accionesPintadas = '';
          cerrarFoco();
        } }
    ]);
  }
}
function tareaParaFoco() {
  var ft = leer('panel-foco-tarea', null);
  if (ft) { return ft; }
  var u = unicoHoy();
  return u && !u.hecho ? { id: u.id, nombre: u.nombre, bloque: u.bloque, esUnico: true } : null;
}
function pintarTareaFoco() {
  var ft = tareaParaFoco();
  var el = $('foco-tarea');
  if (!ft) { el.hidden = true; return; }
  el.innerHTML = '<span>con ' + esc(ft.nombre) + '</span>' +
    (ft.esUnico ? '' : '<button id="quitar-tarea" aria-label="Quitar tarea">✕</button>');
  el.hidden = false;
  if (!ft.esUnico) {
    $('quitar-tarea').addEventListener('click', function () { guardar('panel-foco-tarea', null); pintarTareaFoco(); });
  }
}
function pintarEstadisticas() {
  var log = leer('panel-foco-log', {});
  var hoy = new Date();
  var h = log[claveDia(hoy)];
  var objetivo = leer('panel-objetivo', CONFIG.objetivo);
  var hecho = h ? h.min : 0;
  var cumplido = hecho >= objetivo;
  $('objetivo').className = 'objetivo' + (cumplido ? ' cumplido' : '');
  $('foco-hoy').innerHTML = cumplido
    ? 'Objetivo cumplido: <b>' + duracionTexto(hecho) + '</b>'
    : (hecho ? 'Hoy llevas <b>' + duracionTexto(hecho) + '</b>, te faltan ' + duracionTexto(objetivo - hecho)
             : 'Hoy aún no has hecho ningún bloque');
  texto($('objetivo-btn'), 'Objetivo ' + duracionTexto(objetivo));
  $('objetivo-relleno').style.width = Math.min(100, Math.round(hecho * 100 / objetivo)) + '%';
  var max = 60;
  var dias = [];
  for (var i = 6; i >= 0; i--) {
    var d = new Date(hoy.getTime() - i * 86400000);
    var r = log[claveDia(d)];
    var m = r ? r.min : 0;
    if (m > max) { max = m; }
    dias.push({ d: d, m: m, hoy: i === 0 });
  }
  var html = '';
  dias.forEach(function (x) {
    html += '<div class="semana-dia' + (x.hoy ? ' hoy' : '') + '"><div class="semana-barra" style="height:' +
      Math.round(x.m / max * 22) + 'px"></div>' + INICIALES[x.d.getDay()] + '</div>';
  });
  $('semana').innerHTML = html;
}
// Tocar el objetivo lo cambia: 1 h, 2 h, 3 h, 4 h, 5 h
$('objetivo-btn').addEventListener('click', function () {
  var opciones = [60, 120, 180, 240, 300];
  var actual = leer('panel-objetivo', CONFIG.objetivo);
  var i = opciones.indexOf(actual);
  guardar('panel-objetivo', opciones[(i + 1) % opciones.length]);
  pintarEstadisticas();
});
var botonesFoco = document.querySelectorAll('.foco-btn');
for (var bi = 0; bi < botonesFoco.length; bi++) {
  botonesFoco[bi].addEventListener('click', function () {
    accionesPintadas = '';
    empezarFoco(+this.getAttribute('data-min'), false);
  });
}

/* ---------- Arranque ---------- */
var marcas = document.querySelectorAll('[data-ico]');
for (var mi = 0; mi < marcas.length; mi++) { marcas[mi].outerHTML = icono(marcas[mi].getAttribute('data-ico')); }
tick();
setInterval(tick, 5000);
cargarTiempo();
setInterval(cargarTiempo, 15 * 60000);
cargarDatos();
setInterval(cargarDatos, 5 * 60000);
enviarCola();
setInterval(enviarCola, 5 * 60000);
pintarTareaFoco();
pintarEstadisticas();
if (foco) { abrirFoco(); }
</script>
